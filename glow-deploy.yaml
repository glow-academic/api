# glow-deploy.yaml — Deployment seed configuration
#
# This is a template. Values are resolved from environment variables
# at deploy time using ${VAR:-default} syntax.
#
# For local dev: create glow-deploy.local.yaml (gitignored) with your
# actual providers, models, and auth configuration.
#
# For production: the deploy workflow populates env vars from the
# LearnLoop provision claim, which fills in providers and credentials.

setup: ${SEED_SETUP:-fresh}

# ── AI Providers & Models ─────────────────────────────────
# Add providers with their endpoints and API keys.
# Define models referencing those providers.
# Map agent roles to model names.
ai:
  providers: []

  roles:
    text: ${AI_TEXT_MODEL:-}
    grader: ${AI_GRADER_MODEL:-}
    image: ${AI_IMAGE_MODEL:-}
    video: ${AI_VIDEO_MODEL:-}
    tts: ${AI_TTS_MODEL:-}
    stt: ${AI_STT_MODEL:-}
    realtime: ${AI_REALTIME_MODEL:-}

  models: []

# ── Auth Providers ────────────────────────────────────────
# Add OAuth/OIDC providers with their credentials.
# Each provider needs: name, protocol, slug, display_name,
# client_id, client_secret, and protocol-specific fields.
auth:
  providers: []
