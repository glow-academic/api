# glow-deploy.yaml — Deployment seed configuration
#
# This file configures how a Glow instance is seeded at deploy time.
# Variables use ${VAR:-default} syntax and are resolved from environment.
#
# Usage:
#   Local dev:  uses glow-deploy.local.yaml if present, falls back to this
#   Production: deploy workflow sets env vars from LearnLoop provision claim

setup: ${SEED_SETUP:-university}

# ── AI Providers & Models ─────────────────────────────────
ai:
  providers:
    - name: learnloop
      endpoint: ${AI_BASE_URL:-https://api.learn-loop.org/ai/v1}
      key: ${AI_API_KEY:-}

  # Agent role → model name mapping
  # These are the models agents use by default
  roles:
    text: glow-text
    grader: glow-grader
    image: glow-image
    video: glow-video
    tts: glow-tts
    stt: glow-stt
    realtime: glow-realtime

  # Model definitions — rich schema with modalities, reasoning, temperature, pricing
  # LearnLoop gateway models don't need pricing (handled by gateway)
  models:
    - name: glow-text
      provider: learnloop
      description: "Default text generation model"
      modalities: [text_in, text_out, image_in, audio_in, call_in]
      reasoning_levels: [none, low, medium, high]
      temperature: {min: 0, max: 1.0, step: 0.01}
    - name: glow-grader
      provider: learnloop
      description: "Multimodal grading and evaluation model"
      modalities: [text_in, text_out, image_in, audio_in, call_in]
      reasoning_levels: [none, low, medium, high]
      temperature: {min: 0, max: 1.0, step: 0.01}
    - name: glow-image
      provider: learnloop
      description: "Image generation model"
      modalities: [text_in, image_in, image_out]
    - name: glow-video
      provider: learnloop
      description: "Video generation model"
      modalities: [text_in, image_in, video_out, audio_out]
    - name: glow-tts
      provider: learnloop
      description: "Text to speech model"
      modalities: [text_in, audio_out]
      voices: [alloy, ash, ballad, coral, echo, sage, shimmer, verse]
    - name: glow-stt
      provider: learnloop
      description: "Speech to text model"
      modalities: [audio_in, text_out]
    - name: glow-realtime
      provider: learnloop
      description: "Realtime voice conversation model"
      modalities: [text_in, text_out, audio_in, audio_out, image_in, call_in, call_out]
      temperature: {min: 0, max: 1.0, step: 0.01}
      voices: [alloy, ash, ballad, coral, echo, sage, shimmer, verse]

# ── Auth Providers ────────────────────────────────────────
auth:
  providers:
    - name: learnloop
      protocol: oidc
      slug: learnloop
      display_name: LearnLoop
      client_id: ${LEARNLOOP_CLIENT_ID:-}
      client_secret: ${LEARNLOOP_CLIENT_SECRET:-}
      discovery_url: ${AUTH_ISSUER:-https://api.learn-loop.org}/.well-known/openid-configuration
      authorization_url: ${AUTH_ISSUER:-https://api.learn-loop.org}/authorize
      token_url: ${AUTH_ISSUER_INTERNAL:-}/.well-known/openid-configuration
      client_auth_method: client_secret_post
