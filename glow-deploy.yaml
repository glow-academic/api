# glow-deploy.yaml — Deployment seed configuration
#
# This file configures how a Glow instance is seeded at deploy time.
# Variables use ${VAR:-default} syntax and are resolved from environment.
#
# Usage:
#   Local dev:  export OPENAI_API_KEY=sk-... && make seed-gen
#   Production: deploy workflow sets env vars from LearnLoop provision claim
#
# Setup templates:
#   university    — full setup with scenarios, personas, rubrics, departments
#   organization  — minimal setup for custom deployments
#   fresh         — schema only, no seed data

setup: ${SEED_SETUP:-university}

# ── AI Provider Credentials ───────────────────────────────
# Stored encrypted in providers_resource table.
#
# provider options: learnloop | direct
#   learnloop → uses LearnLoop AI Gateway (single key for all models)
#   direct    → uses provider keys directly (bring your own)
ai:
  provider: ${AI_PROVIDER:-direct}
  learnloop:
    api_key: ${AI_API_KEY:-}
    base_url: ${AI_BASE_URL:-https://api.learn-loop.org/ai/v1}
  direct:
    openai:
      api_key: ${OPENAI_API_KEY:-please_change_me}
    gemini:
      api_key: ${GEMINI_API_KEY:-please_change_me}

# ── Auth Provider Credentials ─────────────────────────────
# Stored encrypted in auth_item_keys_resource / auth_item_values_resource.
#
# provider options: keycloak | learnloop | microsoft | google
#   keycloak   → local Keycloak instance (default, self-contained)
#   learnloop  → "Login with LearnLoop" OAuth
#   microsoft  → Microsoft Entra ID
#   google     → Google Workspace
auth:
  provider: ${AUTH_PROVIDER:-keycloak}
  learnloop:
    client_id: ${AUTH_CLIENT_ID:-}
    client_secret: ${AUTH_CLIENT_SECRET:-}
    issuer: ${AUTH_ISSUER:-https://api.learn-loop.org}
    # Internal issuer for Keycloak server-to-server calls (Docker → host)
    issuer_internal: ${AUTH_ISSUER_INTERNAL:-}
  microsoft:
    client_id: ${MICROSOFT_CLIENT_ID:-please_change_me}
    client_secret: ${MICROSOFT_CLIENT_SECRET:-please_change_me}
    tenant_id: ${MICROSOFT_TENANT_ID:-common}
  google:
    client_id: ${GOOGLE_CLIENT_ID:-please_change_me}
    client_secret: ${GOOGLE_CLIENT_SECRET:-please_change_me}
