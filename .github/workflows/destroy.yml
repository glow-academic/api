name: Destroy

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: 'Deployment UUID'
        required: true

jobs:
  teardown:
    runs-on: self-hosted
    env:
      DEPLOY_DIR: /srv/deploy/live/glow/${{ inputs.deployment_id }}
      COMPOSE_PROJECT_NAME: ${{ inputs.deployment_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Teardown via provisioner
        run: |
          bash scripts/provision.sh teardown \
            --name "${{ inputs.deployment_id }}" \
            --compose-dir "${{ env.DEPLOY_DIR }}"

      - name: Clean up deployment directory
        run: |
          if [ -d "${{ env.DEPLOY_DIR }}" ]; then
            rm -rf "${{ env.DEPLOY_DIR }}"
            echo "Deployment directory removed."
          fi

      - name: Destroy complete
        run: echo "Teardown complete for ${{ inputs.deployment_id }}"
