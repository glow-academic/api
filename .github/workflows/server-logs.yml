name: Server Logs
on:
  workflow_dispatch:
jobs:
  logs:
    runs-on: self-hosted
    steps:
      - name: Server logs
        run: |
          cd /srv/deploy/live/glow-api
          docker compose logs server --tail=300 2>&1 | grep -iE "keycloak|idp|identity|secret|decrypt|auth_item|sync|error|warning|failed" || echo "No matching log lines"
      - name: Check env vars set on server
        run: |
          cd /srv/deploy/live/glow-api
          docker compose exec server env 2>/dev/null | grep -iE "SECRET_KEY|AUTH_SECRET|KEYCLOAK|ORIGIN" | sed 's/=.*/=***/' || echo "Could not read env"
      - name: Check IdPs in Keycloak
        run: |
          cd /srv/deploy/live/glow-api
          KC=$(docker compose ps -q keycloak)
          # Get admin token
          TOKEN=$(docker exec "$KC" sh -c '
            curl -sf -X POST "http://localhost:8080/realms/master/protocol/openid-connect/token" \
              -d "client_id=admin-cli" \
              -d "username=$KEYCLOAK_ADMIN" \
              -d "password=$KEYCLOAK_ADMIN_PASSWORD" \
              -d "grant_type=password" | python3 -c "import sys,json; print(json.load(sys.stdin)[\"access_token\"])"
          ')
          # List IdPs
          docker exec "$KC" sh -c "
            curl -sf -H 'Authorization: Bearer $TOKEN' 'http://localhost:8080/admin/realms/master/identity-provider/instances' | python3 -m json.tool
          " 2>/dev/null || echo "No IdPs found"
