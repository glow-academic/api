name: Redeploy (Update)

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: 'Deployment UUID from LearnLoop API'
        required: true
      instance_id:
        description: 'Instance ID (shared network name for all components)'
        required: true
      origin:
        description: 'Origin URL (e.g. https://glow.learn-loop.org)'
        required: true
      client_origins:
        description: 'Comma-separated client origins for CORS'
        required: false
        default: ''
      app_prefix:
        description: 'API path prefix (e.g. /glow)'
        required: false
        default: ''
      version:
        description: 'Image version (e.g. v0.2.0)'
        required: true
      db_backup:
        description: 'Restore from backup (DESTRUCTIVE — leave empty to keep existing data)'
        required: false
        default: ''
      seed_setup:
        description: 'Seed setup template (university/organization/fresh). DESTRUCTIVE — regenerates database from seeds.'
        required: false
        default: ''
        type: string
      provision_token:
        description: 'One-time token to claim DEPLOYMENT_TOKEN from LearnLoop'
        required: true
      learnloop_api_url:
        description: 'LearnLoop API URL for license validation'
        required: false
        default: 'https://api.learn-loop.org'
      ai_base_url:
        description: 'LearnLoop AI gateway base URL (scope to prod/beta). Defaults to ${learnloop_api_url}/ai/v1.'
        required: false
        default: ''
      custom_domain:
        description: 'Custom domain (e.g. glow.example.com) — added to Traefik Host rule'
        required: false
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  detect-active-environment:
    runs-on: [self-hosted, linux, x64, deploy]
    outputs:
      active-env: ${{ steps.detect.outputs.active-env }}
      target-env: ${{ steps.detect.outputs.target-env }}
      active-kc-env: ${{ steps.detect.outputs.active-kc-env }}
      target-kc-env: ${{ steps.detect.outputs.target-kc-env }}
    env:
      COMPOSE_PROJECT_NAME: ${{ inputs.deployment_id }}
    steps:
      - name: Detect active environment
        id: detect
        run: |
          DEPLOY_DIR="/srv/deploy/live/glow/${{ inputs.deployment_id }}"
          if [ -d "$DEPLOY_DIR" ] && [ -f "$DEPLOY_DIR/scripts/detect-env.sh" ]; then
            cd "$DEPLOY_DIR"
            eval $(./scripts/detect-env.sh)
          fi
          ACTIVE_ENV="${ACTIVE_ENV:-blue}"
          [ -z "$ACTIVE_ENV" ] && ACTIVE_ENV="blue"
          if [ "$ACTIVE_ENV" = "green" ]; then TARGET_ENV="blue"; else TARGET_ENV="green"; fi
          echo "active-env=$ACTIVE_ENV" >> $GITHUB_OUTPUT
          echo "target-env=$TARGET_ENV" >> $GITHUB_OUTPUT
          ACTIVE_KC_ENV="${ACTIVE_KC_ENV:-blue}"
          if [ "$ACTIVE_KC_ENV" = "green" ]; then TARGET_KC_ENV="blue"; else TARGET_KC_ENV="green"; fi
          echo "active-kc-env=$ACTIVE_KC_ENV" >> $GITHUB_OUTPUT
          echo "target-kc-env=$TARGET_KC_ENV" >> $GITHUB_OUTPUT

  redeploy:
    runs-on: [self-hosted, linux, x64, deploy]
    needs: [detect-active-environment]
    concurrency:
      group: deploy-${{ inputs.deployment_id }}
      cancel-in-progress: true
    env:
      DEPLOY_DIR: /srv/deploy/live/glow/${{ inputs.deployment_id }}
      COMPOSE_PROJECT_NAME: ${{ inputs.deployment_id }}
      INSTANCE_ID: ${{ inputs.instance_id }}
      API_SERVER_IMAGE: ghcr.io/learnloopllc/glow-api:${{ inputs.version }}
      API_VERSION: ${{ inputs.version }}
      ACTIVE_ENV: ${{ needs.detect-active-environment.outputs.active-env }}
      ACTIVE_KC_ENV: ${{ needs.detect-active-environment.outputs.active-kc-env }}
      DB_BACKUP: ${{ inputs.db_backup }}
      SEED_SETUP: ${{ inputs.seed_setup }}
      ORIGIN: ${{ inputs.origin }}
      CLIENT_ORIGINS: ${{ inputs.client_origins }}
      APP_PREFIX: ${{ inputs.app_prefix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Stage release
        run: make stage-release DEST=${{ env.DEPLOY_DIR }} SHA=${{ github.sha }}

      - name: Claim DEPLOYMENT_TOKEN from LearnLoop
        run: |
          API_URL="${{ inputs.learnloop_api_url }}"
          HOST=$(echo "$API_URL" | sed 's|https\?://||' | sed 's|/.*||')
          LOCAL_URL="https://localhost/provision/claim"
          # Write to file to avoid shell expansion of ${...} in YAML config
          CLAIM_FILE=$(mktemp)
          curl -sfk -X POST "$LOCAL_URL" \
            -H "Host: $HOST" \
            -H "Content-Type: application/json" \
            -d '{"token": "${{ inputs.provision_token }}"}' \
            -o "$CLAIM_FILE"
          DEPLOYMENT_TOKEN=$(jq -r '.deployment_token' < "$CLAIM_FILE")
          if [ -z "$DEPLOYMENT_TOKEN" ] || [ "$DEPLOYMENT_TOKEN" = "null" ]; then
            echo "::error::Failed to claim deployment token from LearnLoop"
            echo "::error::Response: $(cat "$CLAIM_FILE")"
            rm -f "$CLAIM_FILE"
            exit 1
          fi
          SECRET_KEY=$(jq -r '.secret_key // empty' < "$CLAIM_FILE")
          AI_API_KEY=$(jq -r '.ai_config.api_key // empty' < "$CLAIM_FILE")
          echo "DEPLOYMENT_TOKEN=${DEPLOYMENT_TOKEN}" >> $GITHUB_ENV
          echo "LEARNLOOP_API_URL=${{ inputs.learnloop_api_url }}" >> $GITHUB_ENV
          # AI base URL: explicit input > derived from learnloop_api_url (prod/beta scope)
          if [ -n "${{ inputs.ai_base_url }}" ]; then
            echo "AI_BASE_URL=${{ inputs.ai_base_url }}" >> $GITHUB_ENV
          else
            echo "AI_BASE_URL=${{ inputs.learnloop_api_url }}/ai/v1" >> $GITHUB_ENV
          fi
          if [ -n "$SECRET_KEY" ]; then
            echo "SECRET_KEY=${SECRET_KEY}" >> $GITHUB_ENV
            echo "SECRET_KEY received"
          fi
          if [ -n "$AI_API_KEY" ]; then
            echo "AI_API_KEY=${AI_API_KEY}" >> $GITHUB_ENV
            echo "AI_PROVIDER=learnloop" >> $GITHUB_ENV
            echo "AI API key received — using LearnLoop AI Gateway"
          fi

          # Extract auth config (Login with LearnLoop)
          LEARNLOOP_CLIENT_ID=$(jq -r '.auth_config.oauth_client_id // empty' < "$CLAIM_FILE")
          LEARNLOOP_CLIENT_SECRET=$(jq -r '.auth_config.oauth_client_secret // empty' < "$CLAIM_FILE")
          AUTH_ISSUER=$(jq -r '.auth_config.issuer // empty' < "$CLAIM_FILE")
          AUTH_ISSUER_INTERNAL=$(jq -r '.auth_config.issuer_internal // empty' < "$CLAIM_FILE")
          SEED_SETUP_CLAIMED=$(jq -r '.seed_setup // empty' < "$CLAIM_FILE")

          if [ -n "$LEARNLOOP_CLIENT_ID" ]; then
            echo "AUTH_PROVIDER=learnloop" >> $GITHUB_ENV
            echo "LEARNLOOP_CLIENT_ID=${LEARNLOOP_CLIENT_ID}" >> $GITHUB_ENV
            echo "LEARNLOOP_CLIENT_SECRET=${LEARNLOOP_CLIENT_SECRET}" >> $GITHUB_ENV
            echo "AUTH_ISSUER=${AUTH_ISSUER}" >> $GITHUB_ENV
            echo "AUTH_ISSUER_INTERNAL=${AUTH_ISSUER_INTERNAL}" >> $GITHUB_ENV
            echo "LearnLoop OAuth credentials received"
          fi

          if [ -n "$SEED_SETUP_CLAIMED" ]; then
            echo "SEED_SETUP=${SEED_SETUP_CLAIMED}" >> $GITHUB_ENV
            echo "Seed setup from claim: $SEED_SETUP_CLAIMED"
          fi

          # Base64-encode deploy config directly from file to avoid shell expansion
          DEPLOY_CONFIG_B64=$(jq -r '.deploy_config_yaml // empty' < "$CLAIM_FILE" | base64 -w0)
          if [ -n "$DEPLOY_CONFIG_B64" ] && [ "$DEPLOY_CONFIG_B64" != "" ]; then
            echo "DEPLOY_CONFIG_B64=$DEPLOY_CONFIG_B64" >> $GITHUB_ENV
            echo "Deploy config received from claim"
          fi

          # grace_period_minutes = simulation idle timeout
          GRACE_PERIOD=$(jq -r '.deploy_config_yaml // empty' < "$CLAIM_FILE" | python3 -c "import sys,yaml; d=yaml.safe_load(sys.stdin); print(d.get('grace_period_minutes', 60) if d else 60)" 2>/dev/null || echo "60")
          echo "GRACE_PERIOD_MINUTES=${GRACE_PERIOD}" >> $GITHUB_ENV

          rm -f "$CLAIM_FILE"
          echo "Deployment token claimed successfully"

      - name: Derive auth client secret
        if: env.SECRET_KEY != ''
        run: |
          AUTH_CLIENT_SECRET=$(python3 /dev/stdin "$SECRET_KEY" <<'PYEOF'
          import sys, hashlib, base64
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          from cryptography.hazmat.primitives import hashes
          sk = sys.argv[1]
          salt = hashlib.sha256(b"glow-auth-secret-v1").digest()
          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=salt, iterations=100000)
          key = kdf.derive(sk.encode())
          print(base64.urlsafe_b64encode(key).decode().rstrip("="))
          PYEOF
          )
          echo "AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET}" >> $GITHUB_ENV
          echo "Auth client secret derived from SECRET_KEY"

      - name: Parse subdomain from ORIGIN
        id: parse-origin
        run: |
          DOMAIN=$(echo "$ORIGIN" | sed 's|https://||' | sed 's|http://||')
          SUBDOMAIN=$(echo "$DOMAIN" | cut -d. -f1)
          BASE_DOMAIN=$(echo "$DOMAIN" | cut -d. -f2-)
          echo "subdomain=$SUBDOMAIN" >> $GITHUB_OUTPUT
          echo "base-domain=$BASE_DOMAIN" >> $GITHUB_OUTPUT

      - name: Provision Traefik labels
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          LL_HOST=$(echo "${LEARNLOOP_API_URL:-}" | sed 's|https\?://||' | sed 's|/.*||')
          CUSTOM_DOMAIN="${{ inputs.custom_domain }}"
          bash scripts/provision.sh deploy \
            --name "${{ inputs.deployment_id }}" \
            --subdomain "${{ steps.parse-origin.outputs.subdomain }}" \
            --base-domain "${{ steps.parse-origin.outputs.base-domain }}" \
            --compose-dir ${{ env.DEPLOY_DIR }} \
            --entry-service nginx \
            --entry-port 80 \
            ${LL_HOST:+--learnloop-host "$LL_HOST"} \
            ${CUSTOM_DOMAIN:+--custom-domain "$CUSTOM_DOMAIN"}

      - name: Pre-deploy backup
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          if docker compose ps database --format '{{.Status}}' 2>/dev/null | grep -q "Up"; then
            echo "Creating pre-deploy backup..."
            docker compose exec -T database pg_dump \
              -U ${DB_USER:-myuser} -d ${DB_NAME:-glowapi} \
              --no-owner --no-privileges --exclude-schema=keycloak \
              | gzip > /tmp/pre-deploy-backup.sql.gz
            docker compose cp /tmp/pre-deploy-backup.sql.gz database:/database/history/backup-deploy-$(date +%Y%m%d-%H%M%S).sql.gz
            rm -f /tmp/pre-deploy-backup.sql.gz
            echo "Pre-deploy backup saved"
            docker compose exec -T database sh -c \
              'ls -t /database/history/backup-deploy-*.sql.gz 2>/dev/null | tail -n +8 | xargs rm -f 2>/dev/null; echo "Retention applied"'
          else
            echo "No running database — skipping pre-deploy backup"
          fi

      - name: Write deploy config
        if: env.DEPLOY_CONFIG_B64 != ''
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          echo "$DEPLOY_CONFIG_B64" | base64 -d > glow-deploy.yaml
          echo "Wrote glow-deploy.yaml from provision claim ($(wc -c < glow-deploy.yaml) bytes)"

      - name: Generate seed backup
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          if [ -n "$SEED_SETUP" ] && [ -z "$DB_BACKUP" ]; then
            echo "Generating seed backup from template: $SEED_SETUP"
            cd $DEPLOY_DIR
            pip3 install --quiet asyncpg python-dotenv redis pyyaml testcontainers cryptography 2>/dev/null
            PYTHONPATH=core SEED_SETUP=$SEED_SETUP \
              AUTH_PROVIDER=${AUTH_PROVIDER:-keycloak} \
              LEARNLOOP_CLIENT_ID=${LEARNLOOP_CLIENT_ID:-} \
              LEARNLOOP_CLIENT_SECRET=${LEARNLOOP_CLIENT_SECRET:-} \
              AUTH_ISSUER=${AUTH_ISSUER:-} \
              AUTH_ISSUER_INTERNAL=${AUTH_ISSUER_INTERNAL:-} \
              AI_PROVIDER=${AI_PROVIDER:-direct} \
              AI_API_KEY=${AI_API_KEY:-} \
              python3 -m database.scripts.runner --setup "$SEED_SETUP"
            GENERATED=$(ls -t database/history/*.sql.gz 2>/dev/null | head -1)
            if [ -n "$GENERATED" ]; then
              BACKUP_NAME=$(basename "$GENERATED")
              echo "DB_BACKUP=$BACKUP_NAME" >> $GITHUB_ENV
              echo "Seed backup generated: $BACKUP_NAME"
            else
              echo "::error::Seed generation failed — no backup produced"
              exit 1
            fi
          fi

      - name: Pull server image
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose pull server-blue server-green

      - name: Build database image
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose build database

      - name: Apply migrations
        working-directory: ${{ env.DEPLOY_DIR }}
        run: make migrate-docker TYPE=add

      - name: Write .env
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          cat > .env <<EOF
          COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
          API_VERSION=${API_VERSION}
          ORIGIN=${ORIGIN}
          CLIENT_ORIGINS=${CLIENT_ORIGINS}
          APP_PREFIX=${APP_PREFIX}
          DB_BACKUP=${DB_BACKUP}
          SECRET_KEY=${SECRET_KEY:-}
          DEPLOYMENT_TOKEN=${DEPLOYMENT_TOKEN:-}
          LEARNLOOP_API_URL=${LEARNLOOP_API_URL:-}
          AI_PROVIDER=${AI_PROVIDER:-direct}
          AI_API_KEY=${AI_API_KEY:-}
          AI_BASE_URL=${AI_BASE_URL:-https://api.learn-loop.org/ai/v1}
          AUTH_PROVIDER=${AUTH_PROVIDER:-keycloak}
          AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET:-}
          LEARNLOOP_CLIENT_ID=${LEARNLOOP_CLIENT_ID:-}
          LEARNLOOP_CLIENT_SECRET=${LEARNLOOP_CLIENT_SECRET:-}
          AUTH_ISSUER=${AUTH_ISSUER:-}
          AUTH_ISSUER_INTERNAL=${AUTH_ISSUER_INTERNAL:-}
          ACTIVE_ENV=${ACTIVE_ENV}
          ACTIVE_KC_ENV=${ACTIVE_KC_ENV}
          GRACE_PERIOD_MINUTES=${GRACE_PERIOD_MINUTES:-60}
          EOF
          sed -i 's/^          //' .env

          # Deploy config YAML is written in the "Write deploy config" step above

      - name: Deploy target environment
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          ./scripts/deploy-target.sh ${{ needs.detect-active-environment.outputs.target-env }} ${{ needs.detect-active-environment.outputs.target-kc-env }}

      - name: Switch traffic
        working-directory: ${{ env.DEPLOY_DIR }}
        run: make switch-traffic ENV=${{ needs.detect-active-environment.outputs.target-env }}

      - name: Monitor deployment
        working-directory: ${{ env.DEPLOY_DIR }}
        run: make monitor ENV=${{ needs.detect-active-environment.outputs.target-env }} ROLLBACK_ENV=${{ needs.detect-active-environment.outputs.active-env }}

      - name: Apply remove migrations
        working-directory: ${{ env.DEPLOY_DIR }}
        run: make migrate-docker TYPE=remove

      - name: Notify LearnLoop
        if: always()
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATUS="running"
          else
            STATUS="failed"
          fi
          HOST=$(echo "$LEARNLOOP_API_URL" | sed 's|https\?://||' | sed 's|/.*||')
          curl -sfk -X POST "https://localhost/deploy/${{ inputs.deployment_id }}/callback" \
            -H "Host: $HOST" \
            -H "Authorization: Bearer $DEPLOYMENT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"$STATUS\"}" || echo "Callback failed (non-fatal)"
        env:
          JOB_STATUS: ${{ job.status }}
          LEARNLOOP_API_URL: ${{ inputs.learnloop_api_url }}
          DEPLOYMENT_TOKEN: ${{ env.DEPLOYMENT_TOKEN }}
