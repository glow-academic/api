name: Pipeline

on:
  push:
    branches: [main, beta, v1]
  pull_request:
    branches: [main, beta, v1]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ── Stage 1: Test ───────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r core/requirements.txt -q
          pip install -r core/requirements-dev.txt -q 2>/dev/null || true
          pip install testcontainers -q 2>/dev/null || true

      - name: Run tests
        run: |
          if [ -d "core/tests/unit" ]; then
            TEST_DIR="core/tests/unit"
          else
            TEST_DIR="core/tests"
          fi
          if PYTHONPATH=core python -c "import importlib; importlib.import_module('tests.conftest')" 2>/dev/null; then
            PYTHONPATH=core python -m pytest "$TEST_DIR" -v --tb=short
          else
            echo "Test dependencies not fully available — running import check only"
            PYTHONPATH=core python -c "from app.main import app; print('App imports OK')" || echo "App requires runtime deps"
          fi

  schema-check:
    runs-on: ubuntu-latest
    if: |
      github.ref != 'refs/heads/v1' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - uses: actions/checkout@v5

      - name: Start Postgres
        run: |
          docker run -d --name pg-check \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=test \
            postgres:18-alpine
          for i in $(seq 1 60); do
            docker exec pg-check psql -U test -d test -c "SELECT 1" >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Create infrastructure schemas
        run: |
          docker exec pg-check psql -U test -d test -c \
            "CREATE SCHEMA IF NOT EXISTS keycloak; CREATE SCHEMA IF NOT EXISTS migrations;"

      - name: Validate schema.sql loads
        run: |
          docker exec -i pg-check psql -U test -d test < database/schema.sql
          echo "schema.sql loaded successfully"

      - name: Validate backups restore
        run: |
          for backup in history/*.sql.gz; do
            [ -f "$backup" ] || continue
            NAME=$(basename "$backup")
            echo "Validating: $NAME"
            docker exec pg-check psql -U test -d test -c "DROP DATABASE IF EXISTS backup_test;" 2>/dev/null
            docker exec pg-check psql -U test -d test -c "CREATE DATABASE backup_test;"
            docker exec pg-check psql -U test -d backup_test -c \
              "CREATE SCHEMA IF NOT EXISTS keycloak; CREATE SCHEMA IF NOT EXISTS migrations;"
            gunzip -c "$backup" | docker exec -i pg-check psql -U test -d backup_test -v ON_ERROR_STOP=1
            echo "  $NAME: OK"
          done

      - name: Cleanup
        if: always()
        run: docker rm -f pg-check

  # ── Stage 2: Release ────────────────────────────────────────
  release:
    needs: [test, schema-check]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.test.result == 'success' &&
      (needs.schema-check.result == 'success' || needs.schema-check.result == 'skipped') &&
      github.event_name != 'pull_request'
    outputs:
      released: ${{ steps.check.outputs.released }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "exec(open('core/app/version.py').read()); print(__version__)")
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then
            TAG="v${VERSION}"
          else
            TAG="v${VERSION}-${BRANCH}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Validate version matches branch
        run: |
          MAJOR=$(echo "${{ steps.version.outputs.version }}" | cut -d. -f1)
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "v1" ] && [ "$MAJOR" != "1" ]; then
            echo "::error::v1 branch must have 1.x.x version, got ${{ steps.version.outputs.version }}"
            exit 1
          fi
          if [ "$BRANCH" = "main" ] && [ "$MAJOR" = "1" ]; then
            echo "::error::main branch must not have 1.x.x version, got ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists — skipping build"
            echo "released=false" >> $GITHUB_OUTPUT
          else
            echo "Release $TAG not found — will build"
            echo "released=true" >> $GITHUB_OUTPUT
          fi

      - name: Create tag (idempotent)
        if: steps.check.outputs.released == 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag $TAG already exists — skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.released == 'true'

      - uses: docker/login-action@v4
        if: steps.check.outputs.released == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        if: steps.check.outputs.released == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./core
          file: ./core/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/learnloopllc/glow-api:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/learnloopllc/glow-api:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/learnloopllc/glow-api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Docker image tarball
        if: steps.check.outputs.released == 'true'
        run: |
          docker pull ${{ env.REGISTRY }}/learnloopllc/glow-api:${{ steps.version.outputs.tag }}
          docker tag ${{ env.REGISTRY }}/learnloopllc/glow-api:${{ steps.version.outputs.tag }} glow-api:${{ steps.version.outputs.tag }}
          docker save glow-api:${{ steps.version.outputs.tag }} | gzip > glow-api-${{ steps.version.outputs.tag }}.tar.gz
          echo "Exported $(du -h glow-api-${{ steps.version.outputs.tag }}.tar.gz | cut -f1)"

      - name: Generate OpenAPI spec
        if: steps.check.outputs.released == 'true'
        run: |
          docker run --rm --user root --tmpfs /uploads \
            ${{ env.REGISTRY }}/learnloopllc/glow-api:${{ steps.version.outputs.tag }} \
            python -c "
          import json
          from app.server import fastapi_app
          from app.version import __version__
          from fastapi.openapi.utils import get_openapi
          spec = get_openapi(title=fastapi_app.title, version=__version__, routes=fastapi_app.routes)
          print(json.dumps(spec, indent=2))
          " > openapi.json
          echo "Generated openapi.json ($(wc -c < openapi.json) bytes)"

      - name: Generate compat.json
        if: steps.check.outputs.released == 'true'
        run: |
          python3 -c "
          import yaml, json
          with open('compat.yml') as f:
              data = yaml.safe_load(f)
          data['version'] = '${{ steps.version.outputs.version }}'
          with open('compat.json', 'w') as f:
              json.dump(data, f, indent=2)
          print('Generated compat.json')
          "

      - name: Create release
        if: steps.check.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PRERELEASE=""
          if [ "${{ github.ref_name }}" != "main" ]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$TAG" \
            openapi.json compat.json glow-api-${{ steps.version.outputs.tag }}.tar.gz \
            --title "$TAG" \
            --generate-notes $PRERELEASE
          echo "Created release $TAG"
