name: Check Auth Secret
on:
  workflow_dispatch:
env:
  LIVE_DIR: /srv/deploy/live
jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: Compare AUTH_SECRET hash on server vs client
        run: |
          cd "${LIVE_DIR}/glow-api"
          echo "=== Server AUTH_SECRET (sha256 hash) ==="
          docker compose exec server env 2>/dev/null | grep "^AUTH_SECRET=" | cut -d= -f2- | sha256sum
          echo "=== Client AUTH_SECRET (sha256 hash) ==="
          docker compose exec client env 2>/dev/null | grep "^AUTH_SECRET=" | cut -d= -f2- | sha256sum
          echo "=== Client AUTH_KEYCLOAK_SECRET (sha256 hash) ==="
          docker compose exec client env 2>/dev/null | grep "^AUTH_KEYCLOAK_SECRET=" | cut -d= -f2- | sha256sum || echo "AUTH_KEYCLOAK_SECRET not set on client"
          echo "=== Server AUTH_KEYCLOAK_SECRET (sha256 hash) ==="
          docker compose exec server env 2>/dev/null | grep "^AUTH_KEYCLOAK_SECRET=" | cut -d= -f2- | sha256sum
      - name: Check expected AUTH_SECRET hash
        run: |
          echo "=== Expected AUTH_SECRET from glow/.env.prod ==="
          echo -n 'IH+b+0cX4o07AtlIk3F8olHGF8c2SIIDnOGS8poNVLM=' | sha256sum
      - name: Check client NextAuth env vars
        run: |
          cd "${LIVE_DIR}/glow-api"
          docker compose exec client env 2>/dev/null | grep -iE "AUTH_|NEXTAUTH|ORIGIN|KEYCLOAK" | sed 's/SECRET=.*/SECRET=***/' | sort
