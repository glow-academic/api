name: Deploy Glow API

on:
  workflow_dispatch:
    inputs:
      deployment_name:
        description: 'Deployment name (default: glow-api)'
        required: false
        default: 'glow-api'
      origin:
        description: 'Origin URL (e.g. https://glow.learn-loop.org)'
        required: true
      client_origins:
        description: 'Comma-separated client origins for CORS'
        required: false
        default: ''
      app_prefix:
        description: 'API path prefix (e.g. /glow)'
        required: false
        default: ''
      db_backup:
        description: 'Database backup file to restore (e.g. fresh.sql.gz)'
        required: false
        default: ''
      version:
        description: 'Release version tag'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      server-changed: ${{ steps.changes.outputs.server }}
      database-changed: ${{ steps.changes.outputs.database }}
      any-changes: ${{ steps.changes.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Detect changes
        id: changes
        run: |
          # workflow_dispatch: always build and deploy everything
          echo "server=true" >> $GITHUB_OUTPUT
          echo "database=true" >> $GITHUB_OUTPUT
          echo "any=true" >> $GITHUB_OUTPUT

  detect-active-environment:
    runs-on: [self-hosted, linux, x64, deploy]
    outputs:
      active-env: ${{ steps.detect.outputs.active-env }}
      target-env: ${{ steps.detect.outputs.target-env }}
      has-migrations: ${{ steps.detect.outputs.has-migrations }}
      has-remove-migrations: ${{ steps.detect.outputs.has-remove-migrations }}
    env:
      COMPOSE_PROJECT_NAME: ${{ inputs.deployment_name || 'glow-api' }}
    steps:
      - name: Detect active environment
        id: detect
        run: |
          DEPLOY_DIR="/srv/deploy/live/${{ inputs.deployment_name || 'glow-api' }}"
          if [ -d "$DEPLOY_DIR" ] && [ -f "$DEPLOY_DIR/scripts/detect-env.sh" ]; then
            cd "$DEPLOY_DIR"
            eval $(./scripts/detect-env.sh)
          fi
          ACTIVE_ENV="${ACTIVE_ENV:-blue}"
          [ -z "$ACTIVE_ENV" ] && ACTIVE_ENV="blue"
          if [ "$ACTIVE_ENV" = "green" ]; then TARGET_ENV="blue"; else TARGET_ENV="green"; fi
          echo "Active environment: $ACTIVE_ENV"
          echo "Target environment: $TARGET_ENV"
          echo "active-env=$ACTIVE_ENV" >> $GITHUB_OUTPUT
          echo "target-env=$TARGET_ENV" >> $GITHUB_OUTPUT
          echo "has-migrations=${HAS_MIGRATIONS:-false}" >> $GITHUB_OUTPUT
          echo "has-remove-migrations=${HAS_REMOVE_MIGRATIONS:-false}" >> $GITHUB_OUTPUT

  build-server:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.server-changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with: { clean: true }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta (server)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/learnloopllc/glow-api-server
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-

      - name: Build & push (server)
        uses: docker/build-push-action@v5
        with:
          context: ./core
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-database:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.database-changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with: { clean: true }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta (database)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/learnloopllc/glow-api-database
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-

      - name: Build & push (database)
        uses: docker/build-push-action@v5
        with:
          context: ./database
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: [self-hosted, linux, x64, deploy]
    needs: [detect-changes, detect-active-environment, build-server, build-database]
    if: always()
    concurrency:
      group: deploy-${{ inputs.deployment_name || 'glow-api' }}
      cancel-in-progress: true
    env:
      DEPLOY_DIR: /srv/deploy/live/${{ inputs.deployment_name || 'glow-api' }}
      COMPOSE_PROJECT_NAME: ${{ inputs.deployment_name || 'glow-api' }}
      API_SERVER_IMAGE: ghcr.io/learnloopllc/glow-api-server:latest
      API_DATABASE_IMAGE: ghcr.io/learnloopllc/glow-api-database:latest
      ACTIVE_ENV: ${{ needs.detect-active-environment.outputs.active-env }}
      # All config passed via workflow inputs — no GitHub secrets needed
      DB_BACKUP: ${{ inputs.db_backup }}
      ORIGIN: ${{ inputs.origin }}
      CLIENT_ORIGINS: ${{ inputs.client_origins }}
      APP_PREFIX: ${{ inputs.app_prefix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Stage release
        run: make stage-release DEST=${{ env.DEPLOY_DIR }} SHA=${{ github.sha }}

      - name: Parse subdomain from ORIGIN
        id: parse-origin
        run: |
          DOMAIN=$(echo "$ORIGIN" | sed 's|https://||' | sed 's|http://||')
          SUBDOMAIN=$(echo "$DOMAIN" | cut -d. -f1)
          BASE_DOMAIN=$(echo "$DOMAIN" | cut -d. -f2-)
          echo "subdomain=$SUBDOMAIN" >> $GITHUB_OUTPUT
          echo "base-domain=$BASE_DOMAIN" >> $GITHUB_OUTPUT

      - name: Pull images
        working-directory: ${{ env.DEPLOY_DIR }}
        run: make pull-images

      - name: Provision Traefik labels
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          bash scripts/provision.sh deploy \
            --name "${{ inputs.deployment_name || 'glow-api' }}" \
            --subdomain "${{ steps.parse-origin.outputs.subdomain }}" \
            --base-domain "${{ steps.parse-origin.outputs.base-domain }}" \
            --compose-dir ${{ env.DEPLOY_DIR }} \
            --entry-service nginx \
            --entry-port 80

      - name: Apply add migrations
        working-directory: ${{ env.DEPLOY_DIR }}
        if: needs.detect-active-environment.outputs.has-migrations == 'true'
        run: make migrate-docker TYPE=add

      - name: Deploy target environment
        working-directory: ${{ env.DEPLOY_DIR }}
        run: make deploy-target ENV=${{ needs.detect-active-environment.outputs.target-env }}

      - name: Switch traffic
        working-directory: ${{ env.DEPLOY_DIR }}
        run: make switch-traffic ENV=${{ needs.detect-active-environment.outputs.target-env }}

      - name: Monitor deployment
        working-directory: ${{ env.DEPLOY_DIR }}
        run: make monitor ENV=${{ needs.detect-active-environment.outputs.target-env }} ROLLBACK_ENV=${{ needs.detect-active-environment.outputs.active-env }}

      - name: Apply remove migrations
        working-directory: ${{ env.DEPLOY_DIR }}
        if: success() && needs.detect-active-environment.outputs.has-remove-migrations == 'true'
        run: make migrate-docker TYPE=remove
