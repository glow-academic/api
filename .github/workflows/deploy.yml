name: Deploy (New)

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: 'Deployment UUID from LearnLoop API'
        required: true
      instance_id:
        description: 'Instance ID (shared network name for all components)'
        required: true
      origin:
        description: 'Origin URL (e.g. https://glow.learn-loop.org)'
        required: true
      client_origins:
        description: 'Comma-separated client origins for CORS'
        required: false
        default: ''
      app_prefix:
        description: 'API path prefix (e.g. /glow)'
        required: false
        default: ''
      version:
        description: 'Image version (e.g. v0.2.0)'
        required: true
      db_restore:
        description: 'Backup file to restore (e.g. university.sql.gz or prod-backup.sql.gz). Empty = keep existing DB.'
        required: false
        default: ''
      seed_setup:
        description: 'Seed template to generate (fresh/university/organization). Always runs.'
        required: false
        default: 'fresh'
      encrypted_payload:
        description: 'Encrypted deploy config (hybrid RSA+Fernet) — required for initial deploy'
        required: false
        default: ''
      deployment_token:
        description: 'Deployment token for light redeploys (when encrypted_payload is empty)'
        required: false
        default: ''
      learnloop_api_url:
        description: 'LearnLoop API URL for license validation'
        required: false
        default: 'https://api.learn-loop.org'
      airgapped:
        description: 'If true, server has no public URL (internal only)'
        required: false
        default: 'false'
      custom_domain:
        description: 'Custom domain (e.g. glow.example.com) — added to Traefik Host rule'
        required: false
        default: ''
permissions:
  contents: read
  packages: read

jobs:
  detect-active-environment:
    runs-on: [self-hosted, linux, x64, deploy]
    outputs:
      active-env: ${{ steps.detect.outputs.active-env }}
      target-env: ${{ steps.detect.outputs.target-env }}
      active-kc-env: ${{ steps.detect.outputs.active-kc-env }}
      target-kc-env: ${{ steps.detect.outputs.target-kc-env }}
    env:
      COMPOSE_PROJECT_NAME: ${{ inputs.deployment_id }}
    steps:
      - name: Detect active environment
        id: detect
        run: |
          DEPLOY_DIR="/srv/deploy/live/glow/${{ inputs.deployment_id }}"
          if [ -d "$DEPLOY_DIR" ] && [ -f "$DEPLOY_DIR/scripts/detect-env.sh" ]; then
            cd "$DEPLOY_DIR"
            eval $(./scripts/detect-env.sh)
          fi
          ACTIVE_ENV="${ACTIVE_ENV:-blue}"
          [ -z "$ACTIVE_ENV" ] && ACTIVE_ENV="blue"
          if [ "$ACTIVE_ENV" = "green" ]; then TARGET_ENV="blue"; else TARGET_ENV="green"; fi
          echo "active-env=$ACTIVE_ENV" >> $GITHUB_OUTPUT
          echo "target-env=$TARGET_ENV" >> $GITHUB_OUTPUT
          ACTIVE_KC_ENV="${ACTIVE_KC_ENV:-blue}"
          if [ "$ACTIVE_KC_ENV" = "green" ]; then TARGET_KC_ENV="blue"; else TARGET_KC_ENV="green"; fi
          echo "active-kc-env=$ACTIVE_KC_ENV" >> $GITHUB_OUTPUT
          echo "target-kc-env=$TARGET_KC_ENV" >> $GITHUB_OUTPUT

  deploy:
    runs-on: [self-hosted, linux, x64, deploy]
    needs: [detect-active-environment]
    concurrency:
      group: deploy-${{ inputs.deployment_id }}
      cancel-in-progress: true
    env:
      DEPLOY_DIR: /srv/deploy/live/glow/${{ inputs.deployment_id }}
      COMPOSE_PROJECT_NAME: ${{ inputs.deployment_id }}
      INSTANCE_ID: ${{ inputs.instance_id }}
      API_SERVER_IMAGE: ghcr.io/learnloopllc/glow-api:${{ inputs.version }}
      API_VERSION: ${{ inputs.version }}
      ACTIVE_ENV: ${{ needs.detect-active-environment.outputs.active-env }}
      ACTIVE_KC_ENV: ${{ needs.detect-active-environment.outputs.active-kc-env }}
      DB_RESTORE: ${{ inputs.db_restore }}
      SEED_SETUP: ${{ inputs.seed_setup }}
      ORIGIN: ${{ inputs.origin }}
      CLIENT_ORIGINS: ${{ inputs.client_origins }}
      APP_PREFIX: ${{ inputs.app_prefix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true

      - name: Login GHCR
        run: |
          export DOCKER_CONFIG="$DEPLOY_DIR/.docker"
          mkdir -p "$DOCKER_CONFIG"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> $GITHUB_ENV

      - name: Stage release
        run: make stage-release DEST=${{ env.DEPLOY_DIR }} SHA=${{ github.sha }}

      - name: Decrypt deploy config
        run: |
          if [ -n "$ENCRYPTED_PAYLOAD" ]; then
            echo "Decrypting encrypted_payload..."
            python3 - <<'PYEOF'
          import json, base64, os, sys
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding

          private_key = serialization.load_pem_private_key(
              os.environ['PROVISION_PRIVATE_KEY'].encode(), password=None
          )
          raw = base64.b64decode(os.environ['ENCRYPTED_PAYLOAD'])
          key_len = int.from_bytes(raw[:4], 'big')
          encrypted_key = raw[4:4+key_len]
          encrypted_data = raw[4+key_len:]

          sym_key = private_key.decrypt(
              encrypted_key,
              padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()), algorithm=hashes.SHA256(), label=None)
          )
          f = Fernet(sym_key)
          config = json.loads(f.decrypt(encrypted_data))

          # Write all config values to GITHUB_ENV
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for k, v in config.items():
                  if isinstance(v, dict):
                      v = json.dumps(v)
                  env.write(f'{k}={v}\n')
          PYEOF

          else
            echo "No encrypted_payload — using deployment_token input for light redeploy"
            DEPLOYMENT_TOKEN="${{ inputs.deployment_token }}"
            if [ -z "$DEPLOYMENT_TOKEN" ]; then
              echo "::error::Neither encrypted_payload nor deployment_token provided"
              exit 1
            fi
            echo "DEPLOYMENT_TOKEN=${DEPLOYMENT_TOKEN}" >> $GITHUB_ENV
          fi
          echo "LEARNLOOP_API_URL=${{ inputs.learnloop_api_url }}" >> $GITHUB_ENV
        env:
          PROVISION_PRIVATE_KEY: ${{ secrets.PROVISION_PRIVATE_KEY }}
          ENCRYPTED_PAYLOAD: ${{ inputs.encrypted_payload }}

      - name: Validate deployment token
        run: |
          if [ -z "$DEPLOYMENT_TOKEN" ]; then
            echo "::error::DEPLOYMENT_TOKEN is empty after decryption"
            exit 1
          fi
          echo "DEPLOYMENT_TOKEN is set"

          # Log what was received (without leaking values)
          [ -n "$SECRET_KEY" ] && echo "SECRET_KEY received"
          [ -n "$AI_API_KEY" ] && echo "AI API key received — using LearnLoop AI Gateway"
          [ -n "$LEARNLOOP_CLIENT_ID" ] && echo "LearnLoop OAuth credentials received"
          [ -n "$SEED_SETUP" ] && echo "Seed setup: $SEED_SETUP"
          [ -n "$DEPLOY_CONFIG_B64" ] && echo "Deploy config received"

          # Set AI_PROVIDER if AI key came from payload
          if [ -n "$AI_API_KEY" ] && [ -z "$AI_PROVIDER" ]; then
            echo "AI_PROVIDER=learnloop" >> $GITHUB_ENV
          fi
          # Set AUTH_PROVIDER if LearnLoop OAuth came from payload
          if [ -n "$LEARNLOOP_CLIENT_ID" ] && [ -z "$AUTH_PROVIDER" ]; then
            echo "AUTH_PROVIDER=learnloop" >> $GITHUB_ENV
          fi

          # grace_period_minutes from deploy config
          if [ -n "$DEPLOY_CONFIG_B64" ]; then
            GRACE_PERIOD=$(echo "$DEPLOY_CONFIG_B64" | base64 -d | python3 -c "import sys,yaml; d=yaml.safe_load(sys.stdin); print(d.get('grace_period_minutes', 60) if d else 60)" 2>/dev/null || echo "60")
          else
            GRACE_PERIOD="60"
          fi
          echo "GRACE_PERIOD_MINUTES=${GRACE_PERIOD}" >> $GITHUB_ENV
          echo "Deploy config processed successfully"

      - name: Derive auth client secret
        if: env.SECRET_KEY != ''
        run: |
          AUTH_CLIENT_SECRET=$(python3 /dev/stdin "$SECRET_KEY" <<'PYEOF'
          import sys, hashlib, base64
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
          from cryptography.hazmat.primitives import hashes
          sk = sys.argv[1]
          salt = hashlib.sha256(b"glow-auth-secret-v1").digest()
          kdf = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=salt, iterations=100000)
          key = kdf.derive(sk.encode())
          print(base64.urlsafe_b64encode(key).decode().rstrip("="))
          PYEOF
          )
          echo "AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET}" >> $GITHUB_ENV
          echo "Auth client secret derived from SECRET_KEY"

      - name: Parse subdomain from ORIGIN
        id: parse-origin
        run: |
          DOMAIN=$(echo "$ORIGIN" | sed 's|https://||' | sed 's|http://||')
          SUBDOMAIN=$(echo "$DOMAIN" | cut -d. -f1)
          BASE_DOMAIN=$(echo "$DOMAIN" | cut -d. -f2-)
          echo "subdomain=$SUBDOMAIN" >> $GITHUB_OUTPUT
          echo "base-domain=$BASE_DOMAIN" >> $GITHUB_OUTPUT

      - name: Provision deployment
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          ARGS="--name ${{ inputs.deployment_id }} --compose-dir ${{ env.DEPLOY_DIR }}"
          # Extract LearnLoop API hostname for extra_hosts (hairpin NAT workaround)
          LL_HOST=$(echo "${LEARNLOOP_API_URL:-}" | sed 's|https\?://||' | sed 's|/.*||')
          CUSTOM_DOMAIN="${{ inputs.custom_domain }}"
          if [ "${{ inputs.airgapped }}" = "true" ]; then
            bash scripts/provision.sh deploy $ARGS --airgapped \
              ${LL_HOST:+--learnloop-host "$LL_HOST"} \
              ${CUSTOM_DOMAIN:+--custom-domain "$CUSTOM_DOMAIN"}
          else
            bash scripts/provision.sh deploy $ARGS \
              --subdomain "${{ steps.parse-origin.outputs.subdomain }}" \
              --base-domain "${{ steps.parse-origin.outputs.base-domain }}" \
              --entry-service nginx \
              --entry-port 80 \
              ${LL_HOST:+--learnloop-host "$LL_HOST"} \
              ${CUSTOM_DOMAIN:+--custom-domain "$CUSTOM_DOMAIN"}
          fi

      - name: Write deploy config
        if: env.DEPLOY_CONFIG_B64 != ''
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          echo "$DEPLOY_CONFIG_B64" | base64 -d > glow-deploy.yaml
          echo "Wrote glow-deploy.yaml from provision claim ($(wc -c < glow-deploy.yaml) bytes)"

      - name: Generate seed backup
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          echo "Installing seed runner dependencies..."
          pip3 install --quiet asyncpg python-dotenv redis pyyaml testcontainers cryptography 2>/dev/null

          SETUP="${SEED_SETUP:-fresh}"
          echo "Running seed-gen with setup=$SETUP"

          if [ "$SETUP" = "fresh" ]; then
            PYTHONPATH=core python3 -m database.scripts.runner --modules
          else
            PYTHONPATH=core python3 -m database.scripts.runner --modules
            PYTHONPATH=core python3 -m database.scripts.runner --setup "$SETUP"
          fi

          echo "Seed backup generated: $(ls -lh database/history/*.sql.gz | tail -1)"

          # If no explicit restore target, use the seed output for first deploy
          if [ -z "$DB_RESTORE" ]; then
            echo "DB_BACKUP=${SETUP}.sql.gz" >> $GITHUB_ENV
            echo "DB_RESTORE set to seed output: ${SETUP}.sql.gz"
          else
            echo "DB_BACKUP=${DB_RESTORE}" >> $GITHUB_ENV
            echo "DB_RESTORE from input: ${DB_RESTORE}"
          fi

      - name: Extract uploads from instance backup
        if: env.DB_BACKUP != '' && endsWith(env.DB_BACKUP, '.tar.gz')
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          BACKUP_FILE="history/${DB_BACKUP}"
          if [ -f "$BACKUP_FILE" ]; then
            echo "Extracting uploads from instance backup..."
            TMPDIR=$(mktemp -d)
            tar xzf "$BACKUP_FILE" -C "$TMPDIR"
            UPLOADS=$(find "$TMPDIR" -type d -name "uploads" | head -1)
            if [ -n "$UPLOADS" ] && [ -d "$UPLOADS" ]; then
              # Copy into the volume-init seed directory so volume-init syncs them
              mkdir -p uploads
              cp -a "$UPLOADS"/. uploads/
              echo "Extracted $(find uploads -type f | wc -l) upload files"
            fi
            MANIFEST=$(find "$TMPDIR" -name "manifest.json" | head -1)
            if [ -n "$MANIFEST" ]; then
              echo "Backup manifest: $(cat "$MANIFEST")"
            fi
            rm -rf "$TMPDIR"
          fi

      - name: Pull server image
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose pull server-blue server-green

      - name: Build database image
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose build database

      - name: Apply migrations
        working-directory: ${{ env.DEPLOY_DIR }}
        run: make migrate-docker TYPE=add

      - name: Write .env
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          cat > .env <<EOF
          COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
          API_VERSION=${API_VERSION}
          ORIGIN=${ORIGIN}
          CLIENT_ORIGINS=${CLIENT_ORIGINS}
          APP_PREFIX=${APP_PREFIX}
          DB_BACKUP=${DB_BACKUP}
          SECRET_KEY=${SECRET_KEY:-}
          DEPLOYMENT_TOKEN=${DEPLOYMENT_TOKEN:-}
          LEARNLOOP_API_URL=${LEARNLOOP_API_URL:-}
          AI_PROVIDER=${AI_PROVIDER:-direct}
          AI_API_KEY=${AI_API_KEY:-}
          AI_BASE_URL=${AI_BASE_URL:-https://api.learn-loop.org/ai/v1}
          AUTH_PROVIDER=${AUTH_PROVIDER:-keycloak}
          AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET:-}
          LEARNLOOP_CLIENT_ID=${LEARNLOOP_CLIENT_ID:-}
          LEARNLOOP_CLIENT_SECRET=${LEARNLOOP_CLIENT_SECRET:-}
          AUTH_ISSUER=${AUTH_ISSUER:-}
          AUTH_ISSUER_INTERNAL=${AUTH_ISSUER_INTERNAL:-}
          ACTIVE_ENV=${ACTIVE_ENV}
          ACTIVE_KC_ENV=${ACTIVE_KC_ENV}
          GRACE_PERIOD_MINUTES=${GRACE_PERIOD_MINUTES:-60}
          EOF
          sed -i 's/^          //' .env

          # Deploy config YAML is written in the "Write deploy config" step above

      - name: Deploy target environment
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          ./scripts/deploy-target.sh ${{ needs.detect-active-environment.outputs.target-env }} ${{ needs.detect-active-environment.outputs.target-kc-env }}

      - name: Switch traffic
        working-directory: ${{ env.DEPLOY_DIR }}
        run: make switch-traffic ENV=${{ needs.detect-active-environment.outputs.target-env }}

      - name: Monitor deployment
        working-directory: ${{ env.DEPLOY_DIR }}
        run: make monitor ENV=${{ needs.detect-active-environment.outputs.target-env }} ROLLBACK_ENV=${{ needs.detect-active-environment.outputs.active-env }}

      - name: Apply remove migrations
        working-directory: ${{ env.DEPLOY_DIR }}
        run: make migrate-docker TYPE=remove

      - name: Notify LearnLoop
        if: always()
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATUS="running"
          else
            STATUS="failed"
          fi
          # Self-hosted runner uses localhost with Host header for hairpin NAT
          HOST=$(echo "$LEARNLOOP_API_URL" | sed 's|https\?://||' | sed 's|/.*||')
          curl -sfk -X POST "https://localhost/deploy/${{ inputs.deployment_id }}/callback" \
            -H "Host: $HOST" \
            -H "Authorization: Bearer $DEPLOYMENT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"$STATUS\"}" || echo "Callback failed (non-fatal)"
        env:
          JOB_STATUS: ${{ job.status }}
          LEARNLOOP_API_URL: ${{ inputs.learnloop_api_url }}
          DEPLOYMENT_TOKEN: ${{ env.DEPLOYMENT_TOKEN }}
