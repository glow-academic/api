name: Test Deploy

on:
  workflow_dispatch:
    inputs:
      deployment_name:
        description: 'Deployment name (used as project directory name)'
        required: true
      subdomain:
        description: 'Subdomain for routing'
        required: true
      base_domain:
        description: 'Base domain'
        required: false
        default: 'learn-loop.org'
      version:
        description: 'Image version tag (e.g. v1.0.0)'
        required: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - run: echo "Deploy ${{ inputs.deployment_name }} version ${{ inputs.version }}"
