name: Test Fresh Auth
on:
  workflow_dispatch:
env:
  LIVE_DIR: /srv/deploy/live
jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Test auth flow without cookies
        run: |
          cd "${LIVE_DIR}/glow-api"

          echo "=== 1. Hit signin endpoint (no cookies) ==="
          curl -sv "http://localhost:80/api/auth/signin" 2>&1 | head -30

          echo ""
          echo "=== 2. Hit session endpoint (no cookies) ==="
          curl -s "http://localhost:80/api/auth/session" 2>&1

          echo ""
          echo "=== 3. CSRF token ==="
          curl -s "http://localhost:80/api/auth/csrf" 2>&1

          echo ""
          echo "=== 4. Client providers endpoint ==="
          curl -s "http://localhost:80/api/auth/providers" 2>&1

      - name: Check client startup logs (first 30 lines)
        run: |
          cd "${LIVE_DIR}/glow-api"
          docker compose logs client 2>&1 | head -30

      - name: Recent client errors
        run: |
          cd "${LIVE_DIR}/glow-api"
          docker compose logs client --tail=30 2>&1
