name: Debug Client Secret
on:
  workflow_dispatch:
env:
  LIVE_DIR: /srv/deploy/live
jobs:
  debug:
    runs-on: self-hosted
    steps:
      - name: Compare secrets in detail
        run: |
          cd "${LIVE_DIR}/glow-api"

          echo "=== .env file AUTH_SECRET (first 8 chars) ==="
          grep "^AUTH_SECRET=" .env | cut -d= -f2- | cut -c1-8

          echo "=== Client container AUTH_SECRET env (first 8 chars) ==="
          docker compose exec client env 2>/dev/null | grep "^AUTH_SECRET=" | cut -d= -f2- | cut -c1-8

          echo "=== Client: check if AUTH_SECRET is baked into .next build ==="
          docker compose exec client sh -c 'grep -r "AUTH_SECRET" /app/.next/server/chunks/*.js 2>/dev/null | head -3 || echo "not found in chunks"'
          docker compose exec client sh -c 'grep -rl "AUTH_SECRET" /app/.next/ 2>/dev/null | head -5 || echo "not found"'

          echo "=== Client: check auth.ts or auth config ==="
          docker compose exec client sh -c 'cat /app/auth.ts 2>/dev/null || cat /app/auth.js 2>/dev/null || echo "no auth file"'
          docker compose exec client sh -c 'ls /app/*.ts /app/*.js 2>/dev/null | head -10'

          echo "=== Client: check next.config ==="
          docker compose exec client sh -c 'cat /app/next.config.ts 2>/dev/null || cat /app/next.config.js 2>/dev/null || cat /app/next.config.mjs 2>/dev/null || echo "no next.config"'

      - name: Check if AUTH_SECRET is in server runtime env
        run: |
          cd "${LIVE_DIR}/glow-api"
          echo "=== Node process env at runtime ==="
          docker compose exec client sh -c 'node -e "console.log(process.env.AUTH_SECRET?.substring(0,8))"' 2>/dev/null || echo "node check failed"

      - name: Try to find what secret the JWT was encrypted with
        run: |
          cd "${LIVE_DIR}/glow-api"
          echo "=== Full client error context ==="
          docker compose logs client --tail=50 2>&1 | grep -A2 "auth.*error\|JWTSession\|decryption"
