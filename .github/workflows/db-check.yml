name: DB Check

on:
  workflow_dispatch:

env:
  LIVE_DIR: /srv/deploy/live

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: Check database contents
        run: |
          cd "${LIVE_DIR}/glow-api"
          DB=$(docker compose ps -q database)

          echo "=== Database tables and row counts ==="
          docker exec "$DB" sh -c '
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "
              SELECT schemaname, tablename,
                     (xpath('\''//row/cnt/text()'\'', query_to_xml(format('\''SELECT count(*) as cnt FROM %I.%I'\'', schemaname, tablename), false, true, '\'''\'')))[1]::text::int AS row_count
              FROM pg_tables
              WHERE schemaname = '\''public'\''
              ORDER BY tablename;
            " 2>/dev/null || echo "xpath query failed, trying simple approach"
          '

          echo ""
          echo "=== Key tables check ==="
          docker exec "$DB" sh -c '
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -c "
              SELECT '\''departments: '\'' || count(*) FROM departments;
            " 2>/dev/null
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -c "
              SELECT '\''profiles: '\'' || count(*) FROM profiles;
            " 2>/dev/null
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -c "
              SELECT '\''roles: '\'' || count(*) FROM roles;
            " 2>/dev/null
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -c "
              SELECT '\''auth_items: '\'' || count(*) FROM auth_items;
            " 2>/dev/null
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -c "
              SELECT '\''providers: '\'' || count(*) FROM providers;
            " 2>/dev/null
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -c "
              SELECT '\''models: '\'' || count(*) FROM models;
            " 2>/dev/null
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -c "
              SELECT '\''agents: '\'' || count(*) FROM agents;
            " 2>/dev/null
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -c "
              SELECT '\''simulations: '\'' || count(*) FROM simulations;
            " 2>/dev/null
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -c "
              SELECT '\''setting_profiles: '\'' || count(*) FROM setting_profiles;
            " 2>/dev/null
          '

          echo ""
          echo "=== Department details ==="
          docker exec "$DB" sh -c '
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "
              SELECT id, name, slug FROM departments ORDER BY name;
            " 2>/dev/null || echo "departments table not found"
          '

          echo ""
          echo "=== seed_modules.sql in image? ==="
          docker exec "$DB" sh -c '
            ls -la /database/seeds/seed_modules.sql 2>/dev/null || echo "seed_modules.sql NOT FOUND in image"
            ls /database/seeds/*.sql 2>/dev/null || echo "no .sql files in seeds/"
            echo ""
            echo "=== Python seed files ==="
            ls /database/seeds/*.py 2>/dev/null | head -20
            echo ""
            echo "=== Setup directories ==="
            ls -la /database/seeds/setups/ 2>/dev/null
          '

      - name: Check keycloak schema
        run: |
          cd "${LIVE_DIR}/glow-api"
          DB=$(docker compose ps -q database)

          echo "=== Keycloak schema tables ==="
          docker exec "$DB" sh -c '
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "
              SELECT tablename FROM pg_tables WHERE schemaname = '\''keycloak'\'' ORDER BY tablename;
            " 2>/dev/null || echo "No keycloak schema"
          '
