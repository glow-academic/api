name: Build Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { clean: true }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta (server)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/learnloopllc/glow-api-server
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-

      - name: Build & push (server)
        uses: docker/build-push-action@v5
        with:
          context: ./core
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { clean: true }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta (database)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/learnloopllc/glow-api-database
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-

      - name: Build & push (database)
        uses: docker/build-push-action@v5
        with:
          context: ./database
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
