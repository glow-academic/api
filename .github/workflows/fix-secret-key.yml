name: Fix SECRET_KEY

on:
  workflow_dispatch:

env:
  LIVE_DIR: /srv/deploy/live

jobs:
  fix:
    runs-on: self-hosted
    steps:
      - name: Add SECRET_KEY to .env and restart server
        run: |
          cd "${LIVE_DIR}/glow-api"

          # Add SECRET_KEY if missing
          if ! grep -q "^SECRET_KEY=" .env; then
            echo 'SECRET_KEY=${{ secrets.SECRET_KEY }}' >> .env
            echo "Added SECRET_KEY to .env"
          else
            echo "SECRET_KEY already present"
          fi

          # Restart only the server (it re-runs keycloak sync on startup)
          docker compose up -d --no-deps --force-recreate server
          sleep 15

      - name: Check server sync logs
        run: |
          cd "${LIVE_DIR}/glow-api"
          docker compose logs server --tail=100 2>&1 | grep -iE "keycloak|sync|idp|identity|secret_key|decrypt|error|warning|failed|✅|⚠️|❌" || echo "No matching log lines"

      - name: Check IdPs in Keycloak
        run: |
          cd "${LIVE_DIR}/glow-api"
          KC=$(docker compose ps -q keycloak)
          # Use kcadm.sh instead of curl (since curl not in KC image)
          docker exec "$KC" /opt/keycloak/bin/kcadm.sh config credentials \
            --server http://localhost:8080 \
            --realm master \
            --user "$KEYCLOAK_ADMIN" \
            --password "$KEYCLOAK_ADMIN_PASSWORD" 2>/dev/null || true
          docker exec "$KC" /opt/keycloak/bin/kcadm.sh get identity-provider/instances \
            -r master 2>/dev/null || echo "Could not list IdPs"

      - name: Check glow-client redirect URIs
        run: |
          cd "${LIVE_DIR}/glow-api"
          KC=$(docker compose ps -q keycloak)
          docker exec "$KC" /opt/keycloak/bin/kcadm.sh get clients \
            -r master -q clientId=glow-client \
            --fields clientId,redirectUris,webOrigins 2>/dev/null || echo "Could not query client"
