name: Provision

on:
  workflow_dispatch:
    inputs:
      deployment_name:
        description: 'Deployment name (used as project directory name)'
        required: true
      subdomain:
        description: 'Subdomain for routing'
        required: true
      base_domain:
        description: 'Base domain'
        required: false
        default: 'learn-loop.org'
      version:
        description: 'Image version tag (e.g. v1.0.0)'
        required: true

env:
  PROVISION_BIN: /srv/deploy/provisioner/.venv/bin/provision
  LIVE_DIR: /srv/deploy/live
  REGISTRY: ghcr.io
  IMAGE_NAME: learnloopllc/glow-api

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull image
        run: |
          docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}"

      - name: Stage deployment
        run: |
          DEST="${{ env.LIVE_DIR }}/${{ inputs.deployment_name }}"
          mkdir -p "$DEST"

          cat > "$DEST/docker-compose.yml" << 'DCOMPOSE'
services:
  app:
    image: IMAGE_PLACEHOLDER
    restart: unless-stopped
    environment:
      - DEPLOYMENT_NAME=NAME_PLACEHOLDER
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
DCOMPOSE

          sed -i "s|IMAGE_PLACEHOLDER|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}|" "$DEST/docker-compose.yml"
          sed -i "s|NAME_PLACEHOLDER|${{ inputs.deployment_name }}|" "$DEST/docker-compose.yml"

          echo "${{ inputs.version }}" > "$DEST/DEPLOYED_VERSION"

      - name: Provision via provisioner
        run: |
          ${{ env.PROVISION_BIN }} deploy \
            --name "${{ inputs.deployment_name }}" \
            --subdomain "${{ inputs.subdomain }}" \
            --base-domain "${{ inputs.base_domain }}" \
            --compose-dir "${{ env.LIVE_DIR }}/${{ inputs.deployment_name }}" \
            --entry-service app \
            --entry-port 8080

      - name: Verify deployment
        run: |
          DOMAIN="${{ inputs.subdomain }}.${{ inputs.base_domain }}"
          echo "Checking https://${DOMAIN}/health ..."
          for i in $(seq 1 30); do
            if curl -sf "https://${DOMAIN}/health" 2>/dev/null; then
              echo ""
              echo "Deployment verified!"
              exit 0
            fi
            sleep 2
          done
          echo "Warning: Health check did not pass within 60s (may still be starting)"
