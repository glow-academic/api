name: Provision

on:
  workflow_dispatch:
    inputs:
      deployment_name:
        description: 'Deployment name (used as project directory name)'
        required: true
      subdomain:
        description: 'Subdomain for routing'
        required: true
      base_domain:
        description: 'Base domain'
        required: false
        default: 'learn-loop.org'
      version:
        description: 'Image version tag (e.g. v1.0.0)'
        required: true

env:
  PROVISION_BIN: /srv/deploy/provisioner/.venv/bin/provision
  LIVE_DIR: /srv/deploy/live
  REGISTRY: ghcr.io
  IMAGE_NAME: learnloopllc/glow-api

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image
        run: docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}"

      - name: Stage deployment
        run: |
          DEST="${{ env.LIVE_DIR }}/${{ inputs.deployment_name }}"
          mkdir -p "$DEST"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}"
          NAME="${{ inputs.deployment_name }}"
          VERSION="${{ inputs.version }}"

          printf 'services:\n  app:\n    image: "%s"\n    restart: unless-stopped\n    environment:\n      - DEPLOYMENT_NAME=%s\n      - DEPLOYMENT_VERSION=%s\n    healthcheck:\n      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]\n      interval: 10s\n      timeout: 5s\n      retries: 3\n      start_period: 10s\n' "$IMAGE" "$NAME" "$VERSION" > "$DEST/docker-compose.yml"

          echo "$VERSION" > "$DEST/DEPLOYED_VERSION"

      - name: Deploy via provisioner
        run: |
          ${{ env.PROVISION_BIN }} deploy \
            --name "${{ inputs.deployment_name }}" \
            --subdomain "${{ inputs.subdomain }}" \
            --base-domain "${{ inputs.base_domain }}" \
            --compose-dir "${{ env.LIVE_DIR }}/${{ inputs.deployment_name }}" \
            --entry-service app \
            --entry-port 8080

      - name: Verify deployment
        run: |
          DOMAIN="${{ inputs.subdomain }}.${{ inputs.base_domain }}"
          echo "Checking https://${DOMAIN}/health ..."
          for i in $(seq 1 30); do
            if curl -sf "https://${DOMAIN}/health" 2>/dev/null; then
              echo ""
              echo "Deployment verified!"
              exit 0
            fi
            sleep 2
          done
          echo "Warning: Health check did not pass within 60s (may still be starting)"
