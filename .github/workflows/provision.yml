name: Provision

on:
  workflow_dispatch:
    inputs:
      deployment_name:
        description: 'Deployment name (project directory and compose project name)'
        required: true
      subdomain:
        description: 'Subdomain for routing (e.g., api)'
        required: true
      base_domain:
        description: 'Base domain (e.g., learn-loop.org)'
        required: false
        default: 'learn-loop.org'
      client_origins:
        description: 'Allowed client origins (comma-separated URLs)'
        required: true
      version:
        description: 'Image version tag (e.g., v1.0.0 or latest)'
        required: true
      db_backup:
        description: 'Database backup to restore (e.g., fresh.sql.gz). Leave empty for existing DB.'
        required: false
        default: 'fresh.sql.gz'

env:
  LIVE_DIR: /srv/deploy/live
  REGISTRY: ghcr.io

jobs:
  provision:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull images
        run: |
          docker pull "${{ env.REGISTRY }}/learnloopllc/glow-api-server:${{ inputs.version }}"
          docker pull "${{ env.REGISTRY }}/learnloopllc/glow-api-database:${{ inputs.version }}"

      - name: Stop old stack
        run: |
          DEST="${{ env.LIVE_DIR }}/${{ inputs.deployment_name }}"
          if [ -d "$DEST" ]; then
            cd "$DEST"
            docker compose down -v --remove-orphans 2>/dev/null || true
          fi

      - name: Stage release
        run: |
          DEST="${{ env.LIVE_DIR }}/${{ inputs.deployment_name }}"
          ./scripts/stage-release.sh "$(pwd)" "$DEST" "${{ inputs.version }}"

      - name: Generate secrets and write .env
        run: |
          DEST="${{ env.LIVE_DIR }}/${{ inputs.deployment_name }}"
          SECRET_KEY=$(openssl rand -base64 32)
          DB_PASSWORD=$(openssl rand -base64 16)
          KC_ADMIN_PASSWORD=$(openssl rand -base64 16)

          cat > "$DEST/.env" <<ENVEOF
          COMPOSE_PROJECT_NAME=${{ inputs.deployment_name }}
          ORIGIN=https://${{ inputs.subdomain }}.${{ inputs.base_domain }}
          CLIENT_ORIGINS=${{ inputs.client_origins }}
          SECRET_KEY=${SECRET_KEY}
          DB_PASSWORD=${DB_PASSWORD}
          KEYCLOAK_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD}
          ACTIVE_ENV=blue
          DB_BACKUP=${{ inputs.db_backup }}
          API_SERVER_IMAGE=${{ env.REGISTRY }}/learnloopllc/glow-api-server:${{ inputs.version }}
          API_DATABASE_IMAGE=${{ env.REGISTRY }}/learnloopllc/glow-api-database:${{ inputs.version }}
          ENVEOF
          sed -i 's/^[[:space:]]*//' "$DEST/.env"

      - name: Start stack
        run: |
          DEST="${{ env.LIVE_DIR }}/${{ inputs.deployment_name }}"
          cd "$DEST"
          docker compose up -d --no-build
          sleep 10

      - name: Provision Traefik labels
        run: |
          DEST="${{ env.LIVE_DIR }}/${{ inputs.deployment_name }}"
          cd "$DEST"
          bash scripts/provision.sh deploy \
            --name "${{ inputs.deployment_name }}" \
            --subdomain "${{ inputs.subdomain }}" \
            --base-domain "${{ inputs.base_domain }}" \
            --compose-dir "$DEST" \
            --entry-service nginx \
            --entry-port 80

      - name: Monitor deployment
        run: |
          DEST="${{ env.LIVE_DIR }}/${{ inputs.deployment_name }}"
          cd "$DEST"
          bash scripts/monitor.sh blue green 45

      - name: Clear DB_BACKUP after initial restore
        run: |
          DEST="${{ env.LIVE_DIR }}/${{ inputs.deployment_name }}"
          sed -i 's/^DB_BACKUP=.*/DB_BACKUP=/' "$DEST/.env"

      - name: Verify deployment
        run: |
          DOMAIN="${{ inputs.subdomain }}.${{ inputs.base_domain }}"
          echo "Checking https://${DOMAIN}/health ..."
          for i in $(seq 1 30); do
            if curl -sf "https://${DOMAIN}/health" 2>/dev/null; then
              echo ""
              echo "Deployment verified!"
              exit 0
            fi
            sleep 2
          done
          echo "Warning: Health check did not pass within 60s (may still be starting)"
