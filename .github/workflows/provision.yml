name: Provision

on:
  workflow_dispatch:
    inputs:
      deployment_name:
        description: 'Deployment name (used as project directory name)'
        required: true
      subdomain:
        description: 'Subdomain for routing'
        required: true
      base_domain:
        description: 'Base domain'
        required: false
        default: 'learn-loop.org'
      version:
        description: 'Image version tag (e.g. v1.0.0)'
        required: true

env:
  PROVISION_BIN: /srv/deploy/provisioner/.venv/bin/provision
  LIVE_DIR: /srv/deploy/live
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull images
        run: |
          docker pull "${{ env.REGISTRY }}/learnloopllc/glow-api-server:${{ inputs.version }}"
          docker pull "${{ env.REGISTRY }}/learnloopllc/glow-api-database:${{ inputs.version }}"
          docker pull "${{ env.REGISTRY }}/learnloopllc/glow-client:${{ inputs.version }}" || \
            docker pull "${{ env.REGISTRY }}/learnloopllc/glow-client:latest" || \
            echo "Warning: glow-client image not available yet"

      - name: Stage deployment
        run: |
          DEST="${{ env.LIVE_DIR }}/${{ inputs.deployment_name }}"
          mkdir -p "$DEST"

          # Copy compose stack files
          cp docker-compose.yml "$DEST/"
          cp -r web/ "$DEST/web/"
          cp -r uploads/ "$DEST/uploads/" 2>/dev/null || mkdir -p "$DEST/uploads"
          mkdir -p "$DEST/web/generated"

          # Write .env with deployment config
          cat > "$DEST/.env" <<ENVEOF
          COMPOSE_PROJECT_NAME=${{ inputs.deployment_name }}
          ORIGIN=https://${{ inputs.subdomain }}.${{ inputs.base_domain }}
          APP_PREFIX=
          CLIENT_PORT=80
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          KEYCLOAK_ADMIN=${{ secrets.KEYCLOAK_ADMIN }}
          KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KEYCLOAK_REALM=${{ secrets.KEYCLOAK_REALM }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          AUTH_KEYCLOAK_ID=${{ secrets.AUTH_KEYCLOAK_ID }}
          AUTH_KEYCLOAK_SECRET=${{ secrets.AUTH_CLIENT_SECRET }}
          AUTH_CLIENT_ID=${{ secrets.AUTH_KEYCLOAK_ID }}
          AUTH_CLIENT_SECRET=${{ secrets.AUTH_CLIENT_SECRET }}
          DB_OPERATION=auto
          API_SERVER_IMAGE=${{ env.REGISTRY }}/learnloopllc/glow-api-server:${{ inputs.version }}
          API_DATABASE_IMAGE=${{ env.REGISTRY }}/learnloopllc/glow-api-database:${{ inputs.version }}
          GLOW_CLIENT_IMAGE=${{ env.REGISTRY }}/learnloopllc/glow-client:${{ inputs.version }}
          ENVEOF
          sed -i 's/^[[:space:]]*//' "$DEST/.env"

          echo "${{ inputs.version }}" > "$DEST/DEPLOYED_VERSION"

      - name: Start stack
        run: |
          DEST="${{ env.LIVE_DIR }}/${{ inputs.deployment_name }}"
          cd "$DEST"
          # Clean up any leftover containers/volumes from previous deploys
          docker compose down -v --remove-orphans 2>/dev/null || true
          docker compose pull --ignore-pull-failures
          docker compose up -d --no-build || {
            echo "=== Docker Compose failed. Collecting container logs ==="
            docker compose logs --tail=100 2>&1 || true
            echo "=== Container status ==="
            docker compose ps -a 2>&1 || true
            exit 1
          }
          # Give services a moment to stabilize
          sleep 10

      - name: Deploy via provisioner
        run: |
          ${{ env.PROVISION_BIN }} deploy \
            --name "${{ inputs.deployment_name }}" \
            --subdomain "${{ inputs.subdomain }}" \
            --base-domain "${{ inputs.base_domain }}" \
            --compose-dir "${{ env.LIVE_DIR }}/${{ inputs.deployment_name }}" \
            --entry-service nginx \
            --entry-port 80

      - name: Verify deployment
        run: |
          DOMAIN="${{ inputs.subdomain }}.${{ inputs.base_domain }}"
          echo "Checking https://${DOMAIN}/health ..."
          for i in $(seq 1 30); do
            if curl -sf "https://${DOMAIN}/health" 2>/dev/null; then
              echo ""
              echo "Deployment verified!"
              exit 0
            fi
            sleep 2
          done
          echo "Warning: Health check did not pass within 60s (may still be starting)"
