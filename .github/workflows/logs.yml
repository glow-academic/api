name: Container Logs

on:
  workflow_dispatch:

env:
  LIVE_DIR: /srv/deploy/live

jobs:
  logs:
    runs-on: self-hosted
    steps:
      - name: Container status
        run: |
          cd "${LIVE_DIR}/glow-api"
          echo "=== Container status ==="
          docker compose ps -a
          echo ""
          echo "=== docker-compose.override.yml ==="
          cat docker-compose.override.yml 2>/dev/null || echo "No override file"

      - name: Nginx logs
        run: |
          cd "${LIVE_DIR}/glow-api"
          echo "=== Nginx logs ==="
          docker compose logs nginx --tail=50 2>&1

      - name: Server logs
        run: |
          cd "${LIVE_DIR}/glow-api"
          echo "=== Server logs ==="
          docker compose logs server --tail=30 2>&1

      - name: Docker-gen logs
        run: |
          cd "${LIVE_DIR}/glow-api"
          echo "=== Docker-gen logs ==="
          docker compose logs docker-gen --tail=30 2>&1

      - name: Check generated upstream
        run: |
          cd "${LIVE_DIR}/glow-api"
          echo "=== Generated upstreams.conf ==="
          cat web/generated/upstreams.conf 2>/dev/null || echo "File not found"
          echo ""
          echo "=== Templates dir ==="
          ls -la web/templates/ 2>/dev/null || echo "Dir not found"
