name: Tag, Build & Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write

jobs:
  tag-build-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "exec(open('core/app/version.py').read()); print(__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate version matches branch
        run: |
          MAJOR=$(echo "${{ steps.version.outputs.version }}" | cut -d. -f1)
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [ "$BRANCH" = "v1" ] && [ "$MAJOR" != "1" ]; then
            echo "::error::v1 branch must have 1.x.x version, got ${{ steps.version.outputs.version }}"
            exit 1
          fi
          if [ "$BRANCH" = "main" ] && [ "$MAJOR" = "1" ]; then
            echo "::error::main branch must not have 1.x.x version, got ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Create tag (idempotent)
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag $TAG already exists, skipping creation"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        uses: docker/build-push-action@v5
        with:
          context: ./core
          file: ./core/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/learnloopllc/glow-api-server:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Docker image tarball
        run: |
          docker pull ${{ env.REGISTRY }}/learnloopllc/glow-api-server:${{ steps.version.outputs.tag }}
          docker tag ${{ env.REGISTRY }}/learnloopllc/glow-api-server:${{ steps.version.outputs.tag }} glow-api-server:${{ steps.version.outputs.tag }}
          docker save glow-api-server:${{ steps.version.outputs.tag }} | gzip > glow-api-server-${{ steps.version.outputs.tag }}.tar.gz
          echo "Exported $(du -h glow-api-server-${{ steps.version.outputs.tag }}.tar.gz | cut -f1)"

      - name: Generate OpenAPI spec
        run: |
          # Use the image we just built (has all deps at correct Python version)
          docker run --rm --user root --tmpfs /uploads \
            ${{ env.REGISTRY }}/learnloopllc/glow-api-server:${{ steps.version.outputs.tag }} \
            python -c "
          import json
          from app.server import fastapi_app
          from app.version import __version__
          from fastapi.openapi.utils import get_openapi
          spec = get_openapi(title=fastapi_app.title, version=__version__, routes=fastapi_app.routes)
          print(json.dumps(spec, indent=2))
          " > openapi.json
          echo "Generated openapi.json ($(wc -c < openapi.json) bytes)"

      - name: Generate compat.json
        run: |
          python3 -c "
          import yaml, json
          with open('compat.yml') as f:
              data = yaml.safe_load(f)
          data['version'] = '${{ steps.version.outputs.version }}'
          with open('compat.json', 'w') as f:
              json.dump(data, f, indent=2)
          print('Generated compat.json')
          "

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" &>/dev/null; then
            gh release upload "$TAG" openapi.json compat.json --clobber
            echo "Updated release $TAG"
          else
            gh release create "$TAG" openapi.json compat.json \
              --title "$TAG" \
              --generate-notes
            echo "Created release $TAG"
          fi
