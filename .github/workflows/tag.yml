name: Tag, Build & Release

on:
  push:
    branches: [main]
    paths: [core/app/version.py]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write

jobs:
  tag-build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "exec(open('core/app/version.py').read()); print(__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.exists == 'false'

      - name: Log in to GHCR
        if: steps.check.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: ./core
          file: ./core/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/learnloopllc/glow-api-server:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/learnloopllc/glow-api-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate OpenAPI spec
        if: steps.check.outputs.exists == 'false'
        run: |
          pip install -r core/requirements.txt -q
          PYTHONPATH=core python3 -c "
          import json
          from app.server import fastapi_app
          from app.version import __version__
          from fastapi.openapi.utils import get_openapi
          spec = get_openapi(title=fastapi_app.title, version=__version__, routes=fastapi_app.routes)
          with open('openapi.json', 'w') as f:
              json.dump(spec, f, indent=2)
          print(f'Generated openapi.json ({__version__})')
          "

      - name: Create release with openapi.json
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            openapi.json \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Generate GitHub App token
        if: steps.check.outputs.exists == 'false'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: learnloopllc

      - name: Notify client repo
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/learnloopllc/glow-client/dispatches \
            -f event_type=api-release \
            -f 'client_payload[version]=${{ steps.version.outputs.tag }}'
          echo "Dispatched api-release to glow-client (${{ steps.version.outputs.tag }})"
