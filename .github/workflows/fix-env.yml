name: Fix Env

on:
  workflow_dispatch:

env:
  LIVE_DIR: /srv/deploy/live

jobs:
  fix:
    runs-on: self-hosted
    steps:
      - name: Add AUTH_KEYCLOAK_SECRET to .env
        run: |
          DEST="${LIVE_DIR}/glow-api"
          cd "$DEST"

          echo "=== Current .env (redacted) ==="
          cat .env | sed 's/=.*/=***/'

          # Check if AUTH_KEYCLOAK_SECRET already exists
          if grep -q "^AUTH_KEYCLOAK_SECRET=" .env; then
            echo "AUTH_KEYCLOAK_SECRET already exists in .env"
          else
            echo "Adding AUTH_KEYCLOAK_SECRET to .env"
            echo "AUTH_KEYCLOAK_SECRET=${{ secrets.AUTH_CLIENT_SECRET }}" >> .env
          fi

          echo ""
          echo "=== Updated .env keys ==="
          cat .env | sed 's/=.*/=***/'

      - name: Restart server to pick up new env var
        run: |
          DEST="${LIVE_DIR}/glow-api"
          cd "$DEST"

          echo "=== Restarting server container ==="
          docker compose restart server

          echo "Waiting for server to be healthy..."
          sleep 30

          echo "=== Server status ==="
          docker compose ps server

          echo ""
          echo "=== Server logs (last 30 lines) ==="
          docker compose logs server --tail=30 2>&1

      - name: Verify glow-client was created by keycloak_sync
        run: |
          DEST="${LIVE_DIR}/glow-api"
          cd "$DEST"
          KC=$(docker compose ps -q keycloak)

          docker exec "$KC" sh -c '
            /opt/keycloak/bin/kcadm.sh config credentials \
              --server http://localhost:8080/auth \
              --realm master \
              --user "$KEYCLOAK_ADMIN" \
              --password "$KEYCLOAK_ADMIN_PASSWORD"

            echo "=== glow-client exists? ==="
            /opt/keycloak/bin/kcadm.sh get clients -r master -q clientId=glow-client --fields clientId,enabled,secret,redirectUris
          '
