name: Build & Push

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and push server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/learnloopllc/glow-api-server:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/learnloopllc/glow-api-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  generate-seeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL 18 client (for pg_dump)
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          pg_dump --version

      - name: Install seed dependencies
        run: |
          pip install asyncpg redis testcontainers[postgres,redis]
          pip install -r server/requirements.txt

      - name: Generate base seeds
        run: |
          cd "$(pwd)"
          python -m database.scripts.runner --modules
        env:
          PYTHONPATH: ${{ github.workspace }}/server

      - name: Create placeholder upload dirs for setup seeds
        run: |
          mkdir -p database/output/setups/university/uploads/files/text
          mkdir -p database/output/setups/organization/uploads/files/text
          # Create placeholder text files referenced by university documents
          for f in \
            240250e5-efb5-4d74-91b2-5484d0d9d0d9 \
            1e2da365-fe6c-43ef-bf3a-3395fb281a09 \
            c1464d2f-6fce-45b0-9c86-af40aad3df61 \
            d060952e-f68b-4a67-a231-1dd224937206 \
            2d420b2a-a347-42e9-9e36-b1703d5a9aa3 \
            f6f82c39-2db2-439b-9501-1124821f7c6c \
            c27ec685-ca41-445a-9f51-ea383b32df54 \
            5ac95858-9590-4164-b7d3-ca4285f1e0bf; do
            echo "<p>Placeholder content</p>" > "database/output/setups/university/uploads/files/text/${f}.txt"
          done

      - name: Generate organization setup seeds
        run: |
          python -m database.scripts.runner --setup organization
        env:
          PYTHONPATH: ${{ github.workspace }}/server
        continue-on-error: true

      - name: Generate university setup seeds
        run: |
          python -m database.scripts.runner --setup university
        env:
          PYTHONPATH: ${{ github.workspace }}/server
        continue-on-error: true

      - name: Assemble seed_modules.sql
        run: |
          # load-modules.sh warns but continues if setup seeds are missing
          SEED_SETUP=university bash database/scripts/load-modules.sh --output database/seeds/seed_modules.sql || true
          # Verify at minimum base-seed.sql was included
          if [ ! -f database/seeds/seed_modules.sql ]; then
            echo "ERROR: seed_modules.sql not created"
            exit 1
          fi
          echo "=== Seed file stats ==="
          wc -l database/seeds/seed_modules.sql

      - name: Upload seed artifact
        uses: actions/upload-artifact@v4
        with:
          name: seed-modules
          path: database/seeds/seed_modules.sql
          retention-days: 5

  build-database:
    runs-on: ubuntu-latest
    needs: generate-seeds
    steps:
      - uses: actions/checkout@v4

      - name: Download seed artifact
        uses: actions/download-artifact@v4
        with:
          name: seed-modules
          path: database/seeds/

      - name: Verify seed file
        run: |
          ls -la database/seeds/seed_modules.sql
          wc -l database/seeds/seed_modules.sql

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and push database
        uses: docker/build-push-action@v5
        with:
          context: ./database
          file: ./database/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/learnloopllc/glow-api-database:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/learnloopllc/glow-api-database:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
