name: Build & Push

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and push server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/learnloopllc/glow-api-server:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/learnloopllc/glow-api-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  generate-seeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL 18 client (for pg_dump)
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          pg_dump --version

      - name: Install seed dependencies
        run: |
          pip install asyncpg redis testcontainers[postgres,redis]
          pip install -r server/requirements.txt

      - name: Generate base seeds
        run: |
          cd "$(pwd)"
          python -m database.scripts.runner --modules
        env:
          PYTHONPATH: ${{ github.workspace }}/server

      - name: Generate university setup seeds
        run: |
          python -m database.scripts.runner --setup university
        env:
          PYTHONPATH: ${{ github.workspace }}/server

      - name: Generate organization setup seeds
        run: |
          python -m database.scripts.runner --setup organization
        env:
          PYTHONPATH: ${{ github.workspace }}/server

      - name: Assemble seed_modules.sql
        run: |
          SEED_SETUP=university bash database/scripts/load-modules.sh --output database/seeds/seed_modules.sql

      - name: Upload seed artifact
        uses: actions/upload-artifact@v4
        with:
          name: seed-modules
          path: database/seeds/seed_modules.sql
          retention-days: 5

  build-database:
    runs-on: ubuntu-latest
    needs: generate-seeds
    steps:
      - uses: actions/checkout@v4

      - name: Download seed artifact
        uses: actions/download-artifact@v4
        with:
          name: seed-modules
          path: database/seeds/

      - name: Verify seed file
        run: |
          ls -la database/seeds/seed_modules.sql
          wc -l database/seeds/seed_modules.sql

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and push database
        uses: docker/build-push-action@v5
        with:
          context: ./database
          file: ./database/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/learnloopllc/glow-api-database:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/learnloopllc/glow-api-database:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
