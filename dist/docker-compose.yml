# Glow API — Self-hosted deployment
# All configuration via .env file. Run: ./setup.sh
#
# Required .env vars:
#   ORIGIN          — Your domain (e.g. https://glow.example.com)
#   SECRET_KEY      — Auth credential derivation key (from LearnLoop)
#   DEPLOYMENT_TOKEN — Phone-home token (from LearnLoop)
#   LEARNLOOP_API_URL — LearnLoop API URL

services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-myuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-mypassword}
      - POSTGRES_DB=${DB_NAME:-mydb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${DB_USER:-myuser} -d ${DB_NAME:-mydb}
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/${DB_NAME:-mydb}?currentSchema=keycloak
      KC_DB_USERNAME: ${DB_USER:-myuser}
      KC_DB_PASSWORD: ${DB_PASSWORD:-mypassword}
      KC_DB_SCHEMA: keycloak
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${ORIGIN}/auth
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 2>/dev/null && exec 3<&- && exec 3>&- || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 45s

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${DB_USER:-myuser}:${DB_PASSWORD:-mypassword}@database:5432/${DB_NAME:-mydb}
      - POOL_MODE=session
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=25
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "pgbouncer"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  server:
    image: ${API_REGISTRY:-}glow-api-server:${API_VERSION:?API_VERSION is required}
    restart: unless-stopped
    environment:
      - DB_USER=${DB_USER:-myuser}
      - DB_PASSWORD=${DB_PASSWORD:-mypassword}
      - DB_NAME=${DB_NAME:-mydb}
      - DB_PORT=5432
      - DB_HOST=pgbouncer
      - DOCKER_ENV=1
      - ORIGIN=${ORIGIN}
      - SECRET_KEY=${SECRET_KEY}
      - DEPLOYMENT_TOKEN=${DEPLOYMENT_TOKEN}
      - LEARNLOOP_API_URL=${LEARNLOOP_API_URL:-https://api.learn-loop.org}
      - REDIS_URL=redis://redis:6379
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-master}
    depends_on:
      pgbouncer:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      gunicorn app.main:app -w 1 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --log-level info

volumes:
  pgdata:
